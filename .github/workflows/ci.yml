name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r webapp/BotBoxWeb/requirements.txt

      - name: Run tests
        env:
          DEBUG: "True"
          SECRET_KEY: "django-insecure-ci-test-key"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/botbox"
          DB_SSL: "False"
        run: |
          cd webapp/BotBoxWeb
          python manage.py check
          pytest tests/ -v --tb=short || true

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: botbox
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t botbox-web:${{ github.sha }} \
            -f webapp/BotBoxWeb/Dockerfile .

      - name: Verify image
        run: |
          docker images botbox-web
          