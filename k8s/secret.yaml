apiVersion: v1
kind: Secret
metadata:
  name: botbox-secrets
  namespace: botbox
type: Opaque
stringData:
  POSTGRES_DB: botboxdb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: your-secure-password
  SECRET_KEY: your-django-secret-key
  DATABASE_URL: postgresql://postgres:your-secure-password@db:5432/botboxdb