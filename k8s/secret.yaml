apiVersion: v1
kind: Secret
metadata:
  name: botbox-secrets
  namespace: default
type: Opaque
stringData:
  # Base64 encode in production: echo -n "value" | base64
  DJANGO_SECRET_KEY: "your-django-secret-key-change-in-production"
  DB_USER: "postgres"
  DB_PASSWORD: "your-postgres-password-change-in-production"
  AZURE_STORAGE_ACCOUNT_NAME: "your-azure-account-name"
  AZURE_STORAGE_ACCOUNT_KEY: "your-azure-account-key"
