apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: botbox
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: <ACR_NAME>.azurecr.io/botbox-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DEBUG
              value: "False"
            - name: DB_SSL
              value: "False"
            - name: POSTGRES_HOST
              value: db
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: botbox-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: botbox-secrets
                  key: DATABASE_URL
          command:
            - sh
            - -c
            - |
              python manage.py migrate &&
              python manage.py collectstatic --noinput &&
              python manage.py runserver 0.0.0.0:8000